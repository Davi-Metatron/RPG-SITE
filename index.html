{a},${i})"></span>`:`<span class="dot ${i<f?'on':''}"></span>`).join('')}return `<div class=stl><span style="width:150px">${nm}<small> ${co}pt → +${m}</small></span><span style="flex:1">${v}</span>${edit?`<button onclick="stp(${a},'${s}',-1)">−</button>`:''}<b>${p}</b>${edit?`<button onclick="stp(${a},'${s}',1)">+</button>`:''}</div>`}).join('')+(edit?'':`<small>👁 Visualização somente leitura.</small>`))}
function stp(k,id,s,d){const c=G(k,id);if(!c||!canEdit(c))return toast('Você não tem permissão para alterar este status.');const a=ST.find(x=>x[0]==s),p=c.pt[s]||0;if(d>0&&sp_(c)+(a[4]||1)>(c.lv||1)*10)return toast('Sem pontos disponíveis');if(p+d<0)return;if(s=='hab'&&p+d<habUsed(c))return toast('Esses pontos estão em uso por habilidades');if(a[3]=='n'&&c.nu&&c.nu[s]!==undefined){c.nb=c.nb||{};c.nb[s]=c.nu[s]-p*a[2];delete c.nu[s]}c.pt[s]=p+d;if(c.cu[s]!==undefined)c.cu[s]=Math.max(-c.pt[s]*a[2],Math.min(2*c.pt[s]*a[2],c.cu[s]));save();stt(k,id)}
const nbo=(c,s,mx)=>c.nb&&c.nb[s]!==undefined?c.nb[s]:(c.nu&&c.nu[s]!==undefined?c.nu[s]-mx:0),nvv=(c,s,mx)=>mx+nbo(c,s,mx);

function hbv(id,k,cid,s){const a=G('hb',id);if(!a)return;k=k||'';const c=k&&G(k,cid);if(c&&(!canList(k,c)||!canSee(c)))return toast('Você não tem acesso a esta ficha.');const edit=!c||canEdit(c),lv=c?(c.hl||{})[id]||0:0;s=s??(lv||1);const ctl=c?`<div class=bar>PONTOS DE HABILIDADE ${hpts(c)-habUsed(c)}/${hpts(c)}${a.kind=='tree'?'':` · NÍVEL ${edit?`<button onclick="hlv('${k}','${cid}','${id}',-1,${s})">−</button>`:''}<b>${lv}</b>${edit?`<button onclick="hlv('${k}','${cid}','${id}',1,${s})">+</button>`:''}`}</div>`:'';modal(a.img||'',`${k?`<button onclick="hab('${k}','${cid}')">← voltar</button>`:''}<h2>${E(a.nm)}</h2><p style=color:var(--c)>${a.tp} · ${a.at}${a.kind=='tree'?' · árvore':''}</p>${ctl}`+(a.kind=='tree'?tree(a,c,k,cid):`<div class=dg>${Array.from({length:20},(_,i)=>`<div class="dy ${i+1==s?'on':i<lv?'ok':''}" onclick="hbv('${id}','${k}','${cid}',${i+1})">${i+1}</div>`).join('')}</div><p style="white-space:pre-wrap">${E((a.lv||[])[s-1]||'')}</p>`)+`${edit?`<div class=bar><button onclick="ef('hb','${id}')">✎</button><button onclick="conf('Excluir habilidade?',()=>{S.hb=S.hb.filter(x=>x.id!='${id}');save();closeM();go()})">🗑</button></div>`:''}`,'✦')}

function alset(e,id){const c=G('jg',id);if(!c||!canEdit(c))return toast('Você não tem permissão para alterar esta ficha.');alv(id,pct(e)*100)}

// --- tema do site (só para quem escolheu, neste navegador) ---
const PRE=[['Hacker',{g:'#00ff9c',c:'#00e5ff',r:'#ff2e63',bg:'#04070a',t:'#b8ffe6'}],['Arcano',{g:'#c05cff',c:'#ff7bd5',r:'#ff4d6d',bg:'#07040d',t:'#e9d6ff'}],['Sangue',{g:'#ff3b3b',c:'#ff9e40',r:'#ffffff',bg:'#0b0405',t:'#ffd9d9'}],['Ouro',{g:'#ffc400',c:'#ff8f00',r:'#ff2e63',bg:'#0a0803',t:'#fff2c7'}],['Oceano',{g:'#3fa0ff',c:'#00e5ff',r:'#ff2e63',bg:'#030a12',t:'#d0ecff'}],['Gelo',{g:'#e0f7ff',c:'#8fd3ff',r:'#ff2e63',bg:'#05090d',t:'#ffffff'}]];
function tema(){const t={...TH0,t:'#b8ffe6',...TH},gl=parseInt(t.gl??14);modal('',`<h3>🎨 TEMA DO SITE</h3><small>Vale só para você: cada pessoa escolhe as próprias cores neste navegador.</small>${LIGHT?'<p class=cond>☀️ No modo claro as cores são fixas. Volte ao modo escuro (interruptor no canto superior direito) para usar as suas.</p>':''}<div class=dg>${PRE.map((p,i)=>`<button onclick="thp(${i})">${p[0]}</button>`).join('')}</div>${[['g','Cor principal (bordas e botões)'],['c','Destaque (títulos e brilho)'],['t','Texto'],['r','Alertas'],['bg','Fundo']].map(([k,n])=>`<div class=stl><span style="flex:1">${n}</span><input type=color style="width:60px;height:32px;padding:0;display:inline-block" value="${t[k]}" oninput="th('${k}',this.value)" onchange="save()"></div>`).join('')}<div class=stl><span style="flex:1">✨ Brilho das imagens</span><input type=range min=0 max=40 value="${gl}" style="width:140px;display:inline-block" oninput="th('gl',this.value+'px')" onchange="save()"></div><div class=bar><button onclick="thr()">↺ restaurar padrão</button></div>`)}
function thp(i){TH={...PRE[i][1],gl:TH.gl||'14px'};applyTh();save();tema()}
function thr(){['g','c','r','bg','t','gl'].forEach(k=>document.documentElement.style.removeProperty('--'+k));TH={};applyTh();save();tema()}

// --- permissões e privacidade das fichas ---
const low=x=>(x||'').toString().trim().toLowerCase(),owns=c=>!!MU&&(c.owId===MU||low(c.ow)===low(ME));
const activeUser=()=>L('users').find(u=>u.id===MU),masterUid=()=>S.masterId||(L('users').find(u=>u.role==='master')||{}).id,isM=()=>{const u=activeUser();return !!u&&u.role==='master'&&u.id===masterUid()},canEdit=c=>isM()||owns(c),canList=(k,c)=>!(k==='np'&&!!c.hide&&!isM());
const canSee=c=>!c.pv||isM()||owns(c)||(!!MU&&(c.au||[]).some(v=>v===MU||(ME&&low(v)===low(ME)))),canPv=c=>isM()||owns(c);
function mest(){if(isM())return toast('Você já está usando a única conta do mestre.');gate(true,true)}
function prv(k,id){const c=G(k,id);if(!c||!canList(k,c)||!canPv(c))return;const users=L('users').filter(u=>u.role!=='master'&&u.id!==c.owId&&low(u.nm)!==low(c.ow)),allowed=c.au||[],accounts=L('users');modal('',`${bk2(k,id)}<h3>🔒 ACESSO — ${E(c.nm)}</h3><label style="display:flex;gap:8px;align-items:center"><input type=checkbox style="width:auto" ${c.pv?'checked':''} onchange="pvt('${k}','${id}',this.checked)"> Ficha privada</label><small><b>Pública:</b> todos os jogadores podem abrir e visualizar, mas somente o dono e o Mestre podem editar.<br><b>Privada:</b> todos ainda veem o cartão na lista, mas somente o dono, o Mestre e os jogadores autorizados podem entrar. Quem entrar como autorizado terá apenas visualização.</small><h3>QUEM PODE VISUALIZAR</h3><small>Marque quem poderá abrir esta ficha quando ela estiver privada. Esses jogadores não poderão alterar nada.</small>${users.map(u=>`<label style="display:flex;gap:8px;align-items:center;padding:5px 0"><input type=checkbox style="width:auto" ${allowed.includes(u.id)||allowed.some(v=>low(v)===low(u.nm))?'checked':''} onchange="pva('${k}','${id}','${u.id}',this.checked)">${E(u.nm)}</label>`).join('')||'<small>Não há outros jogadores cadastrados.</small>'}${k==='np'&&isM()?`<hr><label style="display:flex;gap:8px;align-items:center"><input type=checkbox style="width:auto" ${c.hide?'checked':''} onchange="pvh('${k}','${id}',this.checked)"> 👁‍🗨 NPC invisível (somente Mestre)</label><small>Quando ativado, este NPC desaparece completamente da lista dos jogadores: nome, cartão e imagem não serão exibidos dentro do site. Somente o Mestre poderá encontrá-lo e abri-lo.</small>`:''}${isM()?`<hr><h3>👑 PROPRIETÁRIO DA FICHA</h3><small>O Mestre sempre mantém acesso total, mesmo quando transfere a propriedade.</small><select style="width:100%" onchange="pvo('${k}','${id}',this.value)">${accounts.map(u=>`<option value="${u.id}" ${(c.owId===u.id||(!c.owId&&low(c.ow)===low(u.nm)))?'selected':''}>${E(u.nm)}${u.role==='master'?' (Mestre)':''}</option>`).join('')}</select>`:''}`)}
function pva(k,id,userId,v){const c=G(k,id),u=L('users').find(x=>x.id===userId);if(!c||!canList(k,c)||!u||u.role==='master'||!canPv(c))return;c.au=c.au||[];c.au=c.au.filter(x=>x!==userId&&low(x)!==low(u.nm));if(v)c.au.push(userId);save();prv(k,id)}
function pvt(k,id,v){const c=G(k,id);if(!c||!canList(k,c)||!canPv(c))return;if(v)c.pv=1;else delete c.pv;save();prv(k,id)}
function pvh(k,id,v){const c=G(k,id);if(!c||k!=='np'||!isM())return;if(v)c.hide=1;else delete c.hide;save();prv(k,id);go()}
function pvo(k,id,userId){const c=G(k,id),u=L('users').find(x=>x.id===userId);if(!c||!u||!isM())return;c.owId=u.id;c.ow=u.nm;save();prv(k,id)}
function paa(k,id){toast('Selecione os jogadores na lista de permissões.')}
function pau(k,id,i){const c=G(k,id);if(!c||!canList(k,c)||!canPv(c))return;c.au.splice(i,1);save();prv(k,id)}


// --- condições (texto livre) e modo claro ---
function cnd(k,id){const c=G(k,id);if(!c||!canList(k,c)||!canSee(c)||!canEdit(c))return toast('Você não tem permissão para alterar esta ficha.');modal('',`${bk2(k,id)}<h3>🩸 CONDIÇÕES — ${E(c.nm)}</h3><small>Escreva o que quiser. Isso aparece na ficha para quem abri-la.</small><textarea id=cdx maxlength=600 style="min-height:130px" placeholder="Escreva aqui...">${E(c.cd||'')}</textarea><div class=bar><button onclick="cns('${k}','${id}')">💾 salvar</button></div>`)}
function cns(k,id){const c=G(k,id);if(!c||!canEdit(c))return;const v=($('#cdx').value||'').trim();if(v)c.cd=v;else delete c.cd;save();fic(k,id)}
function lig(){LIGHT=!LIGHT;try{localStorage.rpgLight=LIGHT?'1':'0'}catch(e){}applyTh()}
</script></body></html>
